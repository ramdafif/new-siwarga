{% macro user_fields(rws, rts, user=None, prefix='new') %}
<div class="form-field"><label for="{{ prefix }}-name">Nama lengkap</label><input class="input" id="{{ prefix }}-name" name="nama" value="{{ user.nama if user else '' }}" minlength="2" maxlength="100" required autocomplete="name"></div>
<div class="form-field"><label for="{{ prefix }}-email">Email</label><input class="input" id="{{ prefix }}-email" type="email" name="email" value="{{ user.email if user else '' }}" maxlength="190" required autocomplete="email"></div>
<div class="form-field"><label for="{{ prefix }}-role">Peran</label><select class="input" name="role" id="{{ prefix }}-role" required>{% for role, label in ([('WARGA', 'Warga')] if user and user.role == 'WARGA' else [('RW', 'Pengurus RW'), ('RT', 'Pengurus RT'), ('KARANG_TARUNA', 'Karang Taruna')]) %}<option value="{{ role }}" {% if user and user.role == role %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
<div class="form-grid"><div class="form-field"><label for="{{ prefix }}-rw">Rukun Warga</label><select class="input" name="rw_id" id="{{ prefix }}-rw" required><option value="">Pilih RW</option>{% for rw in rws %}<option value="{{ rw.id }}" {% if user and user.rw_id == rw.id %}selected{% endif %}>RW {{ rw.nomor }}</option>{% endfor %}</select></div><div class="form-field"><label for="{{ prefix }}-rt">Rukun Tetangga</label><select class="input" name="rt_id" id="{{ prefix }}-rt"><option value="0">Pilih RT</option>{% for rt in rts %}<option value="{{ rt.id }}" data-rw="{{ rt.rw_id }}" {% if user and user.rt_id == rt.id %}selected{% endif %}>RT {{ rt.nomor }} / RW {{ rt.rw.nomor }}</option>{% endfor %}</select></div></div>
<div class="form-field"><label for="{{ prefix }}-password">{{ 'Reset kata sandi (opsional)' if user else 'Kata sandi awal' }}</label><input class="input" id="{{ prefix }}-password" type="password" name="password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="{{ 'Kosongkan bila tidak diubah' if user else 'Minimal 10 karakter' }}" {% if not user %}required{% endif %}><p class="field-hint">Pengguna wajib mengganti kata sandi awal saat masuk.</p></div>
{% endmacro %}
