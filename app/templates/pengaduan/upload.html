{% from 'components.html' import icon %}
<div data-upload-group><label class="upload-zone">{{ icon('camera', 27) }}<strong>Klik untuk pilih foto atau tarik ke sini</strong><small>JPG, PNG, WebP &middot; Maksimal 3 foto, masing-masing 3 MB</small><input type="file" name="foto" class="file-input" accept="image/jpeg,image/png,image/webp" multiple data-upload-input aria-label="Unggah maksimal tiga foto pendukung"></label><p class="field-error" data-upload-error aria-live="polite"></p><div class="upload-preview" data-upload-preview></div></div>
