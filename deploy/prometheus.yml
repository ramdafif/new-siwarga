global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/siwarga-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: siwarga
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
