server {
    listen 80;
    server_name siwarga.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name siwarga.example.org;
    ssl_certificate /etc/letsencrypt/live/siwarga.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siwarga.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 11m;
    client_body_timeout 60s;
    access_log /var/log/nginx/siwarga-access.log siwarga;

    location = /metrics { return 404; }
    location = /health/ready { return 404; }
    location /static/ {
        alias /srv/siwarga/current/app/static/;
        expires 1h;
        add_header X-Content-Type-Options nosniff;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 75s;
    }
}
